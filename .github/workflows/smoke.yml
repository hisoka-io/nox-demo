name: Live smoke

# Checks the deployed site (the Explorer and /anon-rpc) and the live mixnet suites:
#  - after every successful Railway production deployment
#  - every 6 hours
#  - on demand (optionally against another URL)
on:
  deployment_status:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: Site to test
        default: https://demo.nox.hisoka.io/
        required: false

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  site:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       contains(github.event.deployment.environment, 'production'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium-headless-shell

      - name: Smoke test the deployed site
        env:
          SMOKE_URL: ${{ inputs.url || 'https://demo.nox.hisoka.io/' }}
        run: pnpm smoke

  anon-rpc:
    # Boots the KPS-native Nox worker on /anon-rpc from a cold browser and runs
    # the wallet calls through worker.fetch.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       contains(github.event.deployment.environment, 'production'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium-headless-shell

      - name: Smoke test /anon-rpc on the deployed site
        env:
          SMOKE_URL: ${{ inputs.url || 'https://demo.nox.hisoka.io/' }}
          ANON_RPC_REPORT: anon-rpc-report.json
        run: pnpm smoke:anon-rpc

      - name: Keep the timing report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anon-rpc-report
          path: anon-rpc-report.json
          if-no-files-found: ignore

  mixnet:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Live mixnet suites
        run: pnpm test:live
